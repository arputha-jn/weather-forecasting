<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecasting App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            width: 340px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #ff9800;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #e68900; }
        .temp { font-size: 3rem; font-weight: bold; margin: 10px 0; }
        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        #error { color: #ffeb3b; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="weather-card">
    <h2>Weather Forecast</h2>
    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name...">
        <button onclick="getWeather()">Search</button>
    </div>
    <div id="error"></div>
    <div id="weatherInfo" style="display: none;">
        <h3 id="cityName">City</h3>
        <div class="temp" id="temperature">--°C</div>
        <p id="condition">Condition</p>
        <div class="details">
            <div>
                <strong>Wind</strong>
                <p id="wind">-- km/h</p>
            </div>
            <div>
                <strong>Humidity</strong>
                <p id="humidity">--%</p>
            </div>
        </div>
    </div>
</div>

<script>
    async function getWeather() {
        const city = document.getElementById('cityInput').value.trim();
        const errorDiv = document.getElementById('error');
        const infoDiv = document.getElementById('weatherInfo');
        
        if (!city) return;
        errorDiv.textContent = '';

        try {
            // 1. Get coordinates for the city
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
            const geoData = await geoRes.json();

            if (!geoData.results || geoData.results.length === 0) {
                errorDiv.textContent = 'City not found. Try again.';
                infoDiv.style.display = 'none';
                return;
            }

            const { latitude, longitude, name, country } = geoData.results[0];

            // 2. Get weather for coordinates
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`);
            const weatherData = await weatherRes.json();
            const current = weatherData.current;

            document.getElementById('cityName').textContent = `${name}, ${country}`;
            document.getElementById('temperature').textContent = `${Math.round(current.temperature_2m)}°C`;
            document.getElementById('wind').textContent = `${current.wind_speed_10m} km/h`;
            document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
            document.getElementById('condition').textContent = getWeatherDesc(current.weather_code);
            
            infoDiv.style.display = 'block';
        } catch (err) {
            errorDiv.textContent = 'Failed to fetch weather data.';
        }
    }

    function getWeatherDesc(code) {
        if (code === 0) return 'Clear Sky';
        if (code <= 3) return 'Partly Cloudy';
        if (code <= 48) return 'Foggy';
        if (code <= 67) return 'Rainy';
        if (code <= 77) return 'Snowy';
        return 'Thunderstorm / Showers';
    }
</script>

</body>
</html>
